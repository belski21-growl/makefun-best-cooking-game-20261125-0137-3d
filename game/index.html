<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Padang Kilat 3D — Rumah Makan Padang</title>
<style>
  html, body { margin: 0; padding: 0; background: #17100a; height: 100%; overflow: hidden; }
  body { font-family: system-ui, "Segoe UI", sans-serif; color: #fff8e6; }
  #wrap { position: relative; width: 1280px; height: 720px; margin: 0 auto; }
  #game { display: block; width: 1280px; height: 720px; background: #241708; }
  .pill {
    position: absolute; top: 12px; padding: 6px 14px; border-radius: 999px;
    background: rgba(20, 10, 4, 0.72); border: 1px solid #c98f2e;
    font-weight: 700; font-size: 15px; letter-spacing: 0.04em; z-index: 5;
  }
  #stage-pill { left: 12px; }
  #timer-pill { left: 50%; transform: translateX(-50%); }
  #coins-pill { right: 240px; color: #ffd76a; }
  #streak-pill { right: 12px; color: #ff9d5c; }
  #tickets { position: absolute; top: 52px; left: 12px; display: flex; flex-direction: column; gap: 8px; z-index: 4; }
  #floats { position: absolute; inset: 0; pointer-events: none; z-index: 6; overflow: hidden; }
  #vignette {
    position: absolute; inset: 0; pointer-events: none; z-index: 3; opacity: 0;
    background: radial-gradient(ellipse at center, transparent 55%, rgba(0, 0, 0, 0.75) 100%);
  }
  #horror-banner {
    position: absolute; top: 96px; left: 50%; transform: translateX(-50%);
    display: none; z-index: 7; color: #ff5b5b; font-weight: 800; font-size: 22px;
    text-shadow: 0 0 18px rgba(255, 0, 0, 0.8); letter-spacing: 0.12em;
  }
  #stage-card {
    position: absolute; inset: 0; display: none; z-index: 8;
    flex-direction: column; align-items: center; justify-content: center;
    background: rgba(10, 5, 2, 0.55); text-align: center;
  }
  #stage-big { font-size: 64px; font-weight: 900; letter-spacing: 0.14em; color: #ffd76a; }
  #stage-sub { font-size: 20px; margin-top: 6px; color: #fff8e6; }
  #condiment-bar {
    position: absolute; bottom: 14px; right: 14px; display: none; z-index: 5;
  }
  #condiment-btn {
    padding: 10px 16px; border-radius: 10px; border: 1px solid #c98f2e;
    background: #7a4a12; color: #ffe9b0; font-weight: 700; font-size: 15px; cursor: pointer;
  }
  #overlay {
    position: absolute; inset: 0; display: none; z-index: 9;
    align-items: center; justify-content: center; text-align: center;
    background: rgba(10, 5, 2, 0.78); padding: 24px;
  }
  #status {
    position: absolute; bottom: 12px; left: 12px; z-index: 5; font-size: 13px;
    color: #d8c49a; background: rgba(20, 10, 4, 0.6); padding: 4px 10px; border-radius: 8px;
  }
</style>
</head>
<body>
<noscript><p style="padding:16px">Padang Kilat 3D butuh JavaScript dan WebGL.</p></noscript>
<div id="wrap">
  <canvas id="game" width="1280" height="720"></canvas>
  <div id="stage-pill" class="pill">PAGI</div>
  <div id="timer-pill" class="pill">2:00</div>
  <div id="coins-pill" class="pill">0 koin</div>
  <div id="streak-pill" class="pill">0x kombo</div>
  <div id="tickets"></div>
  <div id="floats"></div>
  <div id="vignette"></div>
  <div id="horror-banner">DIA DATANG…</div>
  <div id="stage-card"><div id="stage-big"></div><div id="stage-sub"></div></div>
  <div id="condiment-bar"><button id="condiment-btn" type="button">Buka Kondimen — 15 koin</button></div>
  <div id="overlay"></div>
  <div id="status">WASD gerak · E masak/saji · P jeda · M bisu</div>
</div>
<script type="importmap">
{ "imports": { "three": "./vendor/three.module.js" } }
</script>
<script type="module" src="./src/main.js"></script>
</body>
</html>
